name: Update golf tournaments
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_tournaments.py'
      - 'data/verified_tournaments.json'
      - '.github/workflows/update-tournaments.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 1-23 * * *'
    - cron: '17 0 * * *'
permissions:
  contents: write
concurrency:
  group: tournament-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the collector
        run: python -m unittest discover -s tests -v
      - name: Collect official schedules and public candidates
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          RUN_WEB_SEARCH: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *' }}
        run: python scripts/collect_tournaments.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json
          if ! git diff --cached --quiet; then
            git commit -m "Update golf tournaments"
            git push
          fi
