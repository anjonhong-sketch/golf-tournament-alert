name: Test collector and build Android
on:
  push:
    paths-ignore:
      - 'data/tournaments.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/collect_tournaments.py --offline
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36"
      - run: gradle --project-dir android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: golf-tournament-alert-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
